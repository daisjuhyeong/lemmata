[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lemmata"
version = "0.1.0"
description = "Lemmata: a researcher's guide that tracks paper, code and runs as a dependency graph (localhost demo)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lemmata = "lemmata.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lemmata"]
